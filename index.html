<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineLyrics AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .lyric-font { font-family: 'Noto Serif', serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // OPTIONAL: If you want to hardcode your key, paste it between the quotes below.
    // Otherwise, entering it once in the UI will save it automatically to your browser.
    const HARDCODED_API_KEY = "";

    const INDIAN_LANGS = [
      "Telugu", "Kannada", "Hindi", "Tamil", "Malayalam", 
      "Bengali", "Punjabi", "Marathi", "Gujarati", "Odia", "Urdu"
    ];

    const WORLD_LANGS = [
      "Arabic", "Brazilian Portuguese", "Chinese", "French", "German", 
      "Italian", "Japanese", "Korean", "Spanish", "Turkish", "Vietnamese"
    ];

    const ALL_LANGUAGES = ["All", ...INDIAN_LANGS, ...WORLD_LANGS].sort();

    const COUNTRIES = [
      "All", "India", "Pakistan", "Bangladesh", "Brazil", "Italy", 
      "France", "Spain", "Vietnam", "Japan", "South Korea", "United States"
    ].sort();

    const LIBRARY = [
      {
        id: "tel-1",
        title: "Samajavaragamana",
        movie: "Ala Vaikunthapurramuloo",
        country: "India",
        language: "Telugu",
        artist: "Sid Sriram",
        gender: "Male",
        year: 2020,
        synopsis: "A melodic celebration of grace and enchantment, where the poet marvels at the mesmerising presence and walking posture of his beloved.",
        lines: [
          {
            time: 0,
            original: "నీ కాళ్లను పట్టుకు వదలనన్నవి చూడే నా కళ్లు",
            translit: "Nee kaallanu pattuku vadalanannavi choode naa kallu",
            translation: "Look, my eyes refuse to leave your feet",
            meaning: "The protagonist is utterly captivated, expressing that his gaze is rooted to her graceful presence.",
            words: [
              { word: "నీ", translit: "Nee", mean: "Your", role: "Possessive Pronoun", root: "Nuvvu" },
              { word: "కాళ్లను", translit: "kaallanu", mean: "Feet", role: "Noun (Accusative)", root: "Kaalu" },
              { word: "పట్టుకు", translit: "pattuku", mean: "Holding onto", role: "Verbal Participle", root: "Pattu" },
              { word: "వదలనన్నవి", translit: "vadalanannavi", mean: "Saying they won't leave", role: "Compound Verb", root: "Vadalu" },
              { word: "చూడే", translit: "choode", mean: "Look here", role: "Imperative Verb", root: "Choodu" },
              { word: "నా", translit: "naa", mean: "My", role: "Possessive Pronoun", root: "Nenu" },
              { word: "కళ్లు", translit: "kallu", mean: "Eyes", role: "Noun (Plural)", root: "Kannu" }
            ]
          }
        ]
      },
      {
        id: "kan-1",
        title: "Ra Ra Rakkamma",
        movie: "Vikrant Rona",
        country: "India",
        language: "Kannada",
        artist: "Nakash Aziz & Sunidhi Chauhan",
        gender: "Duet",
        year: 2022,
        synopsis: "An energetic rhythmic celebration welcoming Queen Rakkamma inside the tavern.",
        lines: [
          {
            time: 0,
            original: "ಗದಗಡ ನಡುಗೋ ಗಡಿಯಾರವೇ",
            translit: "Gada-gada nadugo gadiyaaraave",
            translation: "O clock that shivers and ticks excitedly",
            meaning: "Describing time trembling and racing under the pulsing excitement.",
            words: [
              { word: "ಗದಗಡ", translit: "Gada-gada", mean: "Shaking / Trembling", role: "Onomatopoeic Adverb", root: "Gadagada" },
              { word: "ನಡುಗೋ", translit: "nadugo", mean: "Shivering / Trembling", role: "Participle", root: "Nadugu" },
              { word: "ಗಡಿಯಾರವೇ", translit: "gadiyaaraave", mean: "O Clock!", role: "Vocative Noun", root: "Gadiyaara" }
            ]
          }
        ]
      }
    ];

    function App() {
      const [searchQuery, setSearchQuery] = useState("");
      const [filterLang, setFilterLang] = useState("All");
      const [filterCountry, setFilterCountry] = useState("All");
      const [filterGender, setFilterGender] = useState("All");
      const [outputLang, setOutputLang] = useState("English");
      const [customOutputLang, setCustomOutputLang] = useState("");
      const [selectedSong, setSelectedSong] = useState(LIBRARY[0]);
      const [activeLineIdx, setActiveLineIdx] = useState(0);
      const [selectedWord, setSelectedWord] = useState(LIBRARY[0].lines[0].words[0]);
      const [isPlaying, setIsPlaying] = useState(false);
      const [playbackSeconds, setPlaybackSeconds] = useState(0);
      const [isLoadingAi, setIsLoadingAi] = useState(false);

      // Initialize API key from code default or stored localStorage
      const [apiKey, setApiKey] = useState(() => {
        return HARDCODED_API_KEY || localStorage.getItem("cinelyrics_gemini_key") || "";
      });

      const handleKeyChange = (val) => {
        setApiKey(val);
        localStorage.setItem("cinelyrics_gemini_key", val);
      };

      const effectiveOutputLang = customOutputLang.trim() || outputLang;

      const filteredSongs = useMemo(() => {
        return LIBRARY.filter((s) => {
          const matchesQuery = !searchQuery.trim() || 
            s.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
            s.movie.toLowerCase().includes(searchQuery.toLowerCase());
          const matchesLang = filterLang === "All" || s.language.toLowerCase() === filterLang.toLowerCase();
          const matchesCountry = filterCountry === "All" || s.country.toLowerCase() === filterCountry.toLowerCase();
          const matchesGender = filterGender === "All" || s.gender.toLowerCase() === filterGender.toLowerCase();
          return matchesQuery && matchesLang && matchesCountry && matchesGender;
        });
      }, [searchQuery, filterLang, filterCountry, filterGender]);

      useEffect(() => {
        let interval = null;
        if (isPlaying) {
          interval = setInterval(() => {
            setPlaybackSeconds((prev) => prev + 1);
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [isPlaying]);

      const handleSelectSong = (song) => {
        setSelectedSong(song);
        setActiveLineIdx(0);
        setSelectedWord(song.lines?.[0]?.words?.[0] || null);
        setIsPlaying(false);
        setPlaybackSeconds(0);
      };

      const handleLineClick = (idx) => {
        setActiveLineIdx(idx);
        setSelectedWord(selectedSong.lines[idx].words[0]);
      };

      const handleAskGemini = async () => {
        const keyToUse = apiKey.trim() || HARDCODED_API_KEY.trim();
        if (!keyToUse) {
          alert("Please enter your Gemini API Key in the top right box.");
          return;
        }
        setIsLoadingAi(true);

        const targetSong = searchQuery.trim() 
          ? `the movie song "${searchQuery}"`
          : `an iconic ${filterLang !== 'All' ? filterLang : 'regional'} cinema song from ${filterCountry !== 'All' ? filterCountry : 'India'}`;

        const prompt = `Act as an expert multilingual ethnomusicologist and lyricist.
Provide an excerpt of 2 lines from ${targetSong}.
The target language for all translations, meanings, and word breakdowns is: ${effectiveOutputLang}.

Return ONLY valid JSON matching this schema:
{
  "id": "gemini-${Date.now()}",
  "title": "Song Title",
  "movie": "Movie Name",
  "country": "${filterCountry !== 'All' ? filterCountry : 'Origin Country'}",
  "language": "${filterLang !== 'All' ? filterLang : 'Source Language'}",
  "artist": "Singer Name",
  "gender": "${filterGender !== 'All' ? filterGender : 'Gender'}",
  "year": 2023,
  "synopsis": "Brief theme in ${effectiveOutputLang}",
  "lines": [
    {
      "time": 0,
      "original": "Original script lyrics (max 10 words)",
      "translit": "Romanized transliteration",
      "translation": "Natural translation in ${effectiveOutputLang}",
      "meaning": "Deep context in ${effectiveOutputLang}",
      "words": [
        {
          "word": "original script word",
          "translit": "translit",
          "mean": "literal meaning in ${effectiveOutputLang}",
          "role": "Grammar part of speech",
          "root": "lemma"
        }
      ]
    }
  ]
}`;

        // Uses current gemini-2.5-flash endpoint, falls back to gemini-2.0-flash if needed
        const tryCallModel = async (modelName) => {
          return await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${keyToUse}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { responseMimeType: "application/json" }
            })
          });
        };

        try {
          let res = await tryCallModel("gemini-2.5-flash");
          if (!res.ok) {
            res = await tryCallModel("gemini-2.0-flash");
          }
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);

          const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
          const parsed = JSON.parse(rawText);
          handleSelectSong(parsed);
        } catch (err) {
          alert("Error: " + err.message);
        } finally {
          setIsLoadingAi(false);
        }
      };

      const activeLine = selectedSong.lines?.[activeLineIdx] || selectedSong.lines?.[0] || { words: [] };

      return (
        <div className="max-w-7xl mx-auto p-4 md:p-8 space-y-6">
          <header className="flex flex-col md:flex-row md:items-center justify-between border-b border-slate-800 pb-5 gap-4">
            <div>
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-rose-500 flex items-center justify-center font-bold">
                  ♫
                </div>
                <h1 className="text-2xl font-extrabold tracking-tight">CineLyrics AI</h1>
              </div>
              <p className="text-xs md:text-sm text-slate-400 mt-1">
                Explore Multilingual Cinema Songs • Word-wise Transliteration & Context
              </p>
            </div>

            <div className="flex items-center gap-2 bg-slate-900 border border-slate-800 p-2 rounded-xl text-xs">
              <input
                type="password"
                placeholder="Enter Gemini API Key (Saved to browser)"
                value={apiKey}
                onChange={(e) => handleKeyChange(e.target.value)}
                className="bg-transparent border-none text-slate-200 focus:outline-none px-2 py-1 w-56 text-xs placeholder-slate-500"
              />
              <span className="text-[10px] px-2 py-1 rounded bg-slate-800 text-amber-400 font-mono">Gemini 2.5</span>
            </div>
          </header>

          <section className="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
            <div className="flex flex-col md:flex-row gap-2">
              <input
                type="text"
                placeholder="Search any song (e.g. Masthu Masthu, Samajavaragamana, Kesariya, Bella Ciao)..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="w-full bg-slate-950 border border-slate-700/80 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-400 text-slate-200"
              />
              <button
                onClick={handleAskGemini}
                disabled={isLoadingAi}
                className="bg-gradient-to-r from-rose-600 to-amber-600 hover:from-rose-500 hover:to-amber-500 text-white font-semibold px-6 py-3 rounded-xl text-sm transition shrink-0 disabled:opacity-50"
              >
                {isLoadingAi ? "Searching with Gemini..." : "Search with Gemini"}
              </button>
            </div>

            <div className="grid grid-cols-2 md:grid-cols-4 gap-3 pt-2">
              <div>
                <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">Song Language</label>
                <select
                  value={filterLang}
                  onChange={(e) => setFilterLang(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-sm text-slate-200"
                >
                  {ALL_LANGUAGES.map(l => <option key={l} value={l}>{l}</option>)}
                </select>
              </div>

              <div>
                <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">Country</label>
                <select
                  value={filterCountry}
                  onChange={(e) => setFilterCountry(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-sm text-slate-200"
                >
                  {COUNTRIES.map(c => <option key={c} value={c}>{c}</option>)}
                </select>
              </div>

              <div>
                <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">Vocalist</label>
                <select
                  value={filterGender}
                  onChange={(e) => setFilterGender(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-sm text-slate-200"
                >
                  <option value="All">All Genders</option>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                  <option value="Duet">Duet</option>
                </select>
              </div>

              <div>
                <label className="text-[11px] font-semibold text-amber-400 uppercase tracking-wider block mb-1">Output Lang</label>
                <select
                  value={outputLang}
                  onChange={(e) => {
                    setOutputLang(e.target.value);
                    setCustomOutputLang("");
                  }}
                  className="w-full bg-slate-950 border border-amber-500/50 rounded-lg p-2 text-sm text-amber-300 font-medium"
                >
                  <option value="English">English</option>
                  <option value="Telugu">Telugu</option>
                  <option value="Kannada">Kannada</option>
                  <option value="Hindi">Hindi</option>
                  <option value="Tamil">Tamil</option>
                </select>
              </div>
            </div>
          </section>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div className="lg:col-span-7 space-y-6">
              <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <div className="flex justify-between items-start">
                  <div>
                    <span className="text-[11px] font-semibold uppercase tracking-wider text-rose-400 bg-rose-950/60 px-2.5 py-1 rounded-full border border-rose-800/40">
                      {selectedSong.language} • {selectedSong.country}
                    </span>
                    <h2 className="text-3xl font-extrabold text-white mt-2">{selectedSong.title}</h2>
                    <p className="text-sm text-slate-400 mt-1">
                      Film: <span className="text-slate-200 font-medium">{selectedSong.movie}</span> ({selectedSong.year}) • Singer: <span className="text-slate-200 font-medium">{selectedSong.artist}</span>
                    </p>
                  </div>

                  <button
                    onClick={() => setIsPlaying(!isPlaying)}
                    className="w-12 h-12 rounded-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold flex items-center justify-center transition shadow-lg"
                  >
                    {isPlaying ? "❚❚" : "▶"}
                  </button>
                </div>
              </div>

              <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <h3 className="text-sm font-semibold uppercase tracking-wider text-slate-300">
                    Lyric Lines (Click line to view breakdown)
                  </h3>
                  <span className="text-xs text-amber-400 font-medium">Output: {effectiveOutputLang}</span>
                </div>

                <div className="space-y-3">
                  {selectedSong.lines?.map((line, idx) => {
                    const isActive = activeLineIdx === idx;
                    return (
                      <div
                        key={idx}
                        onClick={() => handleLineClick(idx)}
                        className={`p-4 rounded-xl cursor-pointer transition border ${
                          isActive
                            ? "bg-slate-800/90 border-amber-500 shadow-md translate-x-1"
                            : "bg-slate-950/50 border-slate-800/60 hover:border-slate-700"
                        }`}
                      >
                        <p className="text-lg md:text-xl font-medium text-slate-100 lyric-font">
                          {line.original}
                        </p>
                        <p className="text-xs text-amber-300/80 italic mt-1">{line.translit}</p>
                        <p className="text-sm text-slate-300 mt-2 font-light">↳ {line.translation}</p>
                      </div>
                    );
                  })}
                </div>

                <div className="mt-4 pt-3 border-t border-slate-800 flex justify-between items-center text-xs text-slate-400">
                  <span>To view complete licensed lyrics and full soundtrack:</span>
                  <a
                    href={`https://www.google.com/search?q=${encodeURIComponent(selectedSong.title + " " + selectedSong.movie + " song lyrics " + selectedSong.language)}`}
                    target="_blank"
                    rel="noreferrer"
                    className="text-amber-400 hover:underline font-medium"
                  >
                    Search full lyrics on Google ↗
                  </a>
                </div>
              </div>
            </div>

            <div className="lg:col-span-5 space-y-6">
              <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <h3 className="text-sm font-semibold uppercase tracking-wider text-slate-300 mb-2">
                  Word-by-Word Analysis
                </h3>
                <p className="text-xs text-slate-400 mb-4">
                  Select a word to view grammar role, root, and {effectiveOutputLang} translation:
                </p>

                <div className="flex flex-wrap gap-2 mb-6">
                  {activeLine.words?.map((w, wIdx) => {
                    const isSelected = selectedWord?.word === w.word;
                    return (
                      <button
                        key={wIdx}
                        onClick={() => setSelectedWord(w)}
                        className={`px-3 py-1.5 rounded-lg text-sm font-medium transition ${
                          isSelected
                            ? "bg-amber-500 text-slate-950 font-bold"
                            : "bg-slate-800 text-slate-200 hover:bg-slate-700"
                        }`}
                      >
                        {w.word}
                      </button>
                    );
                  })}
                </div>

                {selectedWord ? (
                  <div className="bg-slate-950/80 border border-slate-800/80 rounded-xl p-4 space-y-3">
                    <div className="flex justify-between items-baseline">
                      <span className="text-2xl font-bold text-amber-400 lyric-font">{selectedWord.word}</span>
                      <span className="text-xs text-rose-300 font-mono italic">[{selectedWord.translit}]</span>
                    </div>

                    <div className="grid grid-cols-2 gap-2 text-xs border-t border-slate-800/80 pt-3">
                      <div>
                        <span className="text-slate-500 block uppercase font-mono text-[10px]">Meaning ({effectiveOutputLang})</span>
                        <span className="text-slate-200 font-medium text-sm">{selectedWord.mean}</span>
                      </div>
                      <div>
                        <span className="text-slate-500 block uppercase font-mono text-[10px]">Grammar Role</span>
                        <span className="text-slate-300">{selectedWord.role}</span>
                      </div>
                      <div className="col-span-2 mt-1">
                        <span className="text-slate-500 block uppercase font-mono text-[10px]">Root / Lemma</span>
                        <span className="text-slate-300 font-mono">{selectedWord.root}</span>
                      </div>
                    </div>
                  </div>
                ) : (
                  <p className="text-xs text-slate-500 italic">Select a word chip above</p>
                )}
              </div>

              <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
                <h3 className="text-sm font-semibold uppercase tracking-wider text-slate-300">
                  Lyrical Context & Cultural Nuance
                </h3>
                <div className="p-4 rounded-xl bg-slate-950/60 border border-slate-800/80">
                  <span className="text-[10px] font-mono uppercase tracking-wider text-amber-400/90 block mb-1">
                    Line Context ({effectiveOutputLang})
                  </span>
                  <p className="text-sm text-slate-200 leading-relaxed">
                    {activeLine.meaning || "Click any line on the left to inspect its contextual interpretation."}
                  </p>
                </div>

                <div className="p-4 rounded-xl bg-slate-950/60 border border-slate-800/80">
                  <span className="text-[10px] font-mono uppercase tracking-wider text-rose-400/90 block mb-1">
                    Song Story & Backdrop
                  </span>
                  <p className="text-sm text-slate-300 leading-relaxed">
                    {selectedSong.synopsis}
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
