<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineLyrics AI</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel for Standalone Browser Execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .lyric-font {
      font-family: 'Noto Serif', serif;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Presets with fair-use short excerpt samples for demonstration
    const PRESETS = [
      {
        id: "telugu-1",
        title: "Samajavaragamana",
        movie: "Ala Vaikunthapurramuloo",
        country: "India",
        language: "Telugu",
        artist: "Sid Sriram",
        gender: "Male",
        year: 2020,
        synopsis: "A melodic celebration of grace and enchantment, where the poet marvels at the mesmerising presence and walking posture of his beloved.",
        lines: [
          {
            time: 0,
            original: "నీ కాళ్లను పట్టుకు వదలనన్నవి చూడే నా కళ్లు",
            translit: "Nee kaallanu pattuku vadalanannavi choode naa kallu",
            translation: "Look, my eyes refuse to leave your feet",
            meaning: "The protagonist is utterly captivated, expressing that his gaze is rooted to her graceful presence.",
            words: [
              { word: "నీ", translit: "Nee", mean: "Your", role: "Possessive Pronoun", root: "Nuvvu" },
              { word: "కాళ్లను", translit: "kaallanu", mean: "Feet", role: "Noun (Accusative)", root: "Kaalu" },
              { word: "పట్టుకు", translit: "pattuku", mean: "Holding onto", role: "Verbal Participle", root: "Pattu" },
              { word: "వదలనన్నవి", translit: "vadalanannavi", mean: "Saying they won't leave", role: "Compound Verb", root: "Vadalu" },
              { word: "చూడే", translit: "choode", mean: "Look here", role: "Imperative Verb", root: "Choodu" },
              { word: "నా", translit: "naa", mean: "My", role: "Possessive Pronoun", root: "Nenu" },
              { word: "కళ్లు", translit: "kallu", mean: "Eyes", role: "Noun (Plural)", root: "Kannu" }
            ]
          },
          {
            time: 5,
            original: "చూపులతో చంపేసే మాయే ఏదో చేశావే",
            translit: "Choopulatho champese maaye edo chesaave",
            translation: "With your glances, you've cast some killer spell",
            meaning: "Her subtle glance carries an overwhelming, enchanting effect that leaves him mesmerized.",
            words: [
              { word: "చూపులతో", translit: "Choopulatho", mean: "With glances", role: "Instrumental Noun", root: "Choopu" },
              { word: "చంపేసే", translit: "champese", mean: "That captivates/slays", role: "Relative Participle", root: "Champu" },
              { word: "మాయే", translit: "maaye", mean: "Magic / Illusion", role: "Noun", root: "Maya" },
              { word: "ఏదో", translit: "edo", mean: "Something / Some", role: "Indefinite Pronoun", root: "Edo" },
              { word: "చేశావే", translit: "chesaave", mean: "You have done", role: "Past Verb (2nd Person)", root: "Cheyu" }
            ]
          }
        ]
      },
      {
        id: "urdu-1",
        title: "Tajdar-e-Haram",
        movie: "Coke Studio Season 8",
        country: "Pakistan",
        language: "Urdu",
        artist: "Atif Aslam",
        gender: "Male",
        year: 2015,
        synopsis: "A devotional qawwali expressing deep longing, humility, and prayer for divine sanctuary and compassion.",
        lines: [
          {
            time: 0,
            original: "تاجدارِ حرم ہو نگاہِ کرم",
            translit: "Tajdar-e-Haram, ho nigah-e-karam",
            translation: "O Sovereign of the Sanctuary, bestow your gaze of benevolence",
            meaning: "A humble plea for grace and spiritual protection addressing the sovereign of the sacred realm.",
            words: [
              { word: "تاجدارِ", translit: "Tajdar-e", mean: "Crown-bearer / Sovereign", role: "Compound Noun (Izafat)", root: "Taj + Dar" },
              { word: "حرم", translit: "Haram", mean: "Sacred Sanctuary", role: "Proper Noun", root: "H-R-M" },
              { word: "ہو", translit: "ho", mean: "May there be / bestow", role: "Subjunctive Verb", root: "Hona" },
              { word: "نگاہِ", translit: "nigah-e", mean: "Glance / Vision of", role: "Noun (Izafat)", root: "Nigah" },
              { word: "کرم", translit: "karam", mean: "Grace / Benevolence", role: "Noun", root: "K-R-M" }
            ]
          },
          {
            time: 6,
            original: "ہم غریبوں کے سر پر بھی سایہ رہے",
            translit: "Hum ghareebon ke sar par bhi saya rahe",
            translation: "May a protective shelter remain over the heads of the humble",
            meaning: "Asking for enduring guidance, mercy, and solace for those with humble and weary hearts.",
            words: [
              { word: "ہم", translit: "Hum", mean: "We / Us", role: "Personal Pronoun", root: "Hum" },
              { word: "غریبوں", translit: "ghareebon", mean: "Humble ones / Poor", role: "Plural Noun", root: "Ghareeb" },
              { word: "کے", translit: "ke", mean: "Of", role: "Postposition", root: "Ka/Ke" },
              { word: "سر", translit: "sar", mean: "Head", role: "Noun", root: "Sar" },
              { word: "پر", translit: "par", mean: "Upon / Over", role: "Postposition", root: "Par" },
              { word: "بھی", translit: "bhi", mean: "Also / Even", role: "Particle", root: "Bhi" },
              { word: "سایہ", translit: "saya", mean: "Shade / Shelter", role: "Noun", root: "Saya" },
              { word: "رہے", translit: "rahe", mean: "May it remain", role: "Imperative / Wish Verb", root: "Rehna" }
            ]
          }
        ]
      },
      {
        id: "brazil-1",
        title: "Garota de Ipanema",
        movie: "Copacabana Mon Amour",
        country: "Brazil",
        language: "Portuguese",
        artist: "Astrud Gilberto",
        gender: "Female",
        year: 1964,
        synopsis: "The timeless bossa nova standard capturing the poetic melancholy of youth, sun, and passing beauty in Rio de Janeiro.",
        lines: [
          {
            time: 0,
            original: "Olha que coisa mais linda, mais cheia de graça",
            translit: "Olha que coisa mais linda, mais cheia de graça",
            translation: "Look what a beautiful thing, so full of grace",
            meaning: "The narrator stops in admiration as the graceful girl walks past along the sunlit beach.",
            words: [
              { word: "Olha", translit: "Olha", mean: "Look", role: "Imperative Verb", root: "Olhar" },
              { word: "que", translit: "que", mean: "What a", role: "Exclamatory Pronoun", root: "Que" },
              { word: "coisa", translit: "coisa", mean: "Thing / Sight", role: "Noun (Feminine)", root: "Coisa" },
              { word: "mais", translit: "mais", mean: "Most / More", role: "Adverb", root: "Mais" },
              { word: "linda", translit: "linda", mean: "Pretty / Beautiful", role: "Adjective", root: "Lindo" },
              { word: "cheia", translit: "cheia", mean: "Full", role: "Adjective", root: "Cheio" },
              { word: "de", translit: "de", mean: "Of", role: "Preposition", root: "De" },
              { word: "graça", translit: "graça", mean: "Grace / Charm", role: "Noun", root: "Graça" }
            ]
          }
        ]
      }
    ];

    function App() {
      const [filterLang, setFilterLang] = useState("All");
      const [filterCountry, setFilterCountry] = useState("All");
      const [filterGender, setFilterGender] = useState("All");
      const [outputLang, setOutputLang] = useState("English");
      const [selectedSong, setSelectedSong] = useState(PRESETS[0]);
      const [activeLineIdx, setActiveLineIdx] = useState(0);
      const [selectedWord, setSelectedWord] = useState(PRESETS[0].lines[0].words[0]);
      const [isPlaying, setIsPlaying] = useState(false);
      const [playbackSeconds, setPlaybackSeconds] = useState(0);
      const [apiKey, setApiKey] = useState("");
      const [customPrompt, setCustomPrompt] = useState("");
      const [isLoadingAi, setIsLoadingAi] = useState(false);

      // Playback simulation ticker
      useEffect(() => {
        let interval = null;
        if (isPlaying) {
          interval = setInterval(() => {
            setPlaybackSeconds((prev) => {
              const nextSec = prev + 1;
              const matchingIdx = selectedSong.lines.findIndex((l, i) => {
                const nextLineTime = selectedSong.lines[i + 1]?.time ?? Infinity;
                return nextSec >= l.time && nextSec < nextLineTime;
              });
              if (matchingIdx !== -1 && matchingIdx !== activeLineIdx) {
                setActiveLineIdx(matchingIdx);
                setSelectedWord(selectedSong.lines[matchingIdx].words[0]);
              }
              return nextSec;
            });
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [isPlaying, selectedSong, activeLineIdx]);

      const handleSelectSong = (song) => {
        setSelectedSong(song);
        setActiveLineIdx(0);
        setSelectedWord(song.lines[0]?.words?.[0] || null);
        setIsPlaying(false);
        setPlaybackSeconds(0);
      };

      const handleLineClick = (idx) => {
        setActiveLineIdx(idx);
        setSelectedWord(selectedSong.lines[idx].words[0]);
        setPlaybackSeconds(selectedSong.lines[idx].time);
      };

      const filteredSongs = PRESETS.filter((song) => {
        const matchL = filterLang === "All" || song.language.toLowerCase() === filterLang.toLowerCase();
        const matchC = filterCountry === "All" || song.country.toLowerCase() === filterCountry.toLowerCase();
        const matchG = filterGender === "All" || song.gender.toLowerCase() === filterGender.toLowerCase();
        return matchL && matchC && matchG;
      });

      const handleAskGemini = async () => {
        if (!apiKey.trim()) {
          alert("Please enter a valid Gemini API key first.");
          return;
        }
        setIsLoadingAi(true);
        try {
          const prompt = `Analyze up to 2 excerpt lines from the movie song: "${customPrompt || selectedSong.title}".
Format STRICTLY as JSON with schema:
{
  "id": "custom-1",
  "title": "Song Title",
  "movie": "Movie Name",
  "country": "${filterCountry !== 'All' ? filterCountry : 'Original Country'}",
  "language": "${filterLang !== 'All' ? filterLang : 'Original Language'}",
  "artist": "Singer Name",
  "gender": "${filterGender !== 'All' ? filterGender : 'Vocalist Gender'}",
  "year": 2024,
  "synopsis": "Brief theme and poetic meaning summary in ${outputLang}",
  "lines": [
    {
      "time": 0,
      "original": "Original script lyrics (max 2 lines)",
      "translit": "Romanized transliteration",
      "translation": "Meaning in ${outputLang}",
      "meaning": "Deep emotional and cultural context in ${outputLang}",
      "words": [
        {"word": "word", "translit": "translit", "mean": "meaning in ${outputLang}", "role": "grammatical part of speech", "root": "root lemma"}
      ]
    }
  ]
}`;
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { responseMimeType: "application/json" }
            })
          });
          const data = await res.json();
          const parsed = JSON.parse(data.candidates[0].content.parts[0].text);
          handleSelectSong(parsed);
          setCustomPrompt("");
        } catch (err) {
          alert("Error analyzing with Gemini: " + err.message);
        } finally {
          setIsLoadingAi(false);
        }
      };

      const activeLine = selectedSong.lines[activeLineIdx] || selectedSong.lines[0];

      return (
        <div className="max-w-7xl mx-auto p-4 md:p-8 space-y-6">
          {/* Header */}
          <header className="flex flex-col md:flex-row md:items-center justify-between border-b border-slate-800 pb-5 gap-4">
            <div>
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-rose-500 flex items-center justify-center shadow-lg shadow-rose-500/20">
                  <span className="text-xl font-bold">♫</span>
                </div>
                <h1 className="text-2xl font-extrabold tracking-tight">CineLyrics AI</h1>
              </div>
              <p className="text-xs md:text-sm text-slate-400 mt-1">
                Multilingual Cinema Lyrics • Word-wise Transliteration & Context
              </p>
            </div>

            {/* API Key configuration */}
            <div className="flex items-center gap-2 bg-slate-900 border border-slate-800 p-2 rounded-xl text-xs">
              <input
                type="password"
                placeholder="Enter Gemini API Key"
                value={apiKey}
                onChange={(e) => setApiKey(e.target.value)}
                className="bg-transparent border-none text-slate-200 focus:outline-none px-2 py-1 w-48 text-xs placeholder-slate-500"
              />
              <span className="text-[10px] px-2 py-1 rounded bg-slate-800 text-slate-400 font-mono">Gemini 1.5</span>
            </div>
          </header>

          {/* Filter Bar */}
          <section className="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 shadow-xl backdrop-blur-md grid grid-cols-2 md:grid-cols-5 gap-3">
            <div>
              <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">Language</label>
              <select
                value={filterLang}
                onChange={(e) => setFilterLang(e.target.value)}
                className="w-full bg-slate-950 border border-slate-700/80 rounded-lg p-2 text-sm text-slate-200 focus:outline-none focus:border-amber-400"
              >
                <option value="All">All Languages</option>
                <option value="Telugu">Telugu</option>
                <option value="Urdu">Urdu</option>
                <option value="Portuguese">Portuguese</option>
                <option value="Italian">Italian</option>
                <option value="Vietnamese">Vietnamese</option>
                <option value="Tamil">Tamil</option>
                <option value="Bengali">Bengali</option>
              </select>
            </div>

            <div>
              <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">Country</label>
              <select
                value={filterCountry}
                onChange={(e) => setFilterCountry(e.target.value)}
                className="w-full bg-slate-950 border border-slate-700/80 rounded-lg p-2 text-sm text-slate-200 focus:outline-none focus:border-amber-400"
              >
                <option value="All">All Countries</option>
                <option value="India">India</option>
                <option value="Pakistan">Pakistan</option>
                <option value="Brazil">Brazil</option>
                <option value="Italy">Italy</option>
                <option value="Vietnam">Vietnam</option>
                <option value="Bangladesh">Bangladesh</option>
              </select>
            </div>

            <div>
              <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">Vocalist</label>
              <select
                value={filterGender}
                onChange={(e) => setFilterGender(e.target.value)}
                className="w-full bg-slate-950 border border-slate-700/80 rounded-lg p-2 text-sm text-slate-200 focus:outline-none focus:border-amber-400"
              >
                <option value="All">All Genders</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Duet">Duet</option>
              </select>
            </div>

            <div>
              <label className="text-[11px] font-semibold text-amber-400 uppercase tracking-wider block mb-1">Output Lang</label>
              <select
                value={outputLang}
                onChange={(e) => setOutputLang(e.target.value)}
                className="w-full bg-slate-950 border border-amber-500/50 rounded-lg p-2 text-sm text-amber-300 font-medium focus:outline-none focus:border-amber-400"
              >
                <option value="English">English</option>
                <option value="Telugu">Telugu</option>
                <option value="Hindi">Hindi</option>
                <option value="Spanish">Spanish</option>
                <option value="French">French</option>
              </select>
            </div>

            <div className="col-span-2 md:col-span-1 flex items-end">
              <button
                onClick={() => {
                  const candidate = filteredSongs[0];
                  if (candidate) handleSelectSong(candidate);
                }}
                className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2 px-3 rounded-lg text-sm transition"
              >
                Apply Filters
              </button>
            </div>
          </section>

          {/* AI Search & Explore bar */}
          <div className="flex gap-2">
            <input
              type="text"
              placeholder="Ask Gemini to load any movie song (e.g. 'Po Ve Po from 3' or 'Dil Diyan Gallan')..."
              value={customPrompt}
              onChange={(e) => setCustomPrompt(e.target.value)}
              className="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500 text-slate-200"
            />
            <button
              onClick={handleAskGemini}
              disabled={isLoadingAi}
              className="bg-gradient-to-r from-rose-600 to-amber-600 hover:from-rose-500 hover:to-amber-500 text-white font-semibold px-6 py-3 rounded-xl text-sm transition flex items-center gap-2 shadow-lg shadow-rose-950 disabled:opacity-50"
            >
              {isLoadingAi ? "Analyzing..." : "Ask Gemini"}
            </button>
          </div>

          {/* Main Layout: Left = Song List & Player, Right = Word-wise & Context Breakdown */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            {/* Left 7 Columns */}
            <div className="lg:col-span-7 space-y-6">
              {/* Song Information Card */}
              <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-xl relative overflow-hidden">
                <div className="absolute top-0 right-0 w-48 h-48 bg-amber-500/5 rounded-full blur-3xl pointer-events-none" />

                <div className="flex justify-between items-start">
                  <div>
                    <span className="text-[11px] font-semibold uppercase tracking-wider text-rose-400 bg-rose-950/60 px-2.5 py-1 rounded-full border border-rose-800/40">
                      {selectedSong.language} • {selectedSong.country}
                    </span>
                    <h2 className="text-3xl font-extrabold text-white mt-2">{selectedSong.title}</h2>
                    <p className="text-sm text-slate-400 mt-1">
                      Film: <span className="text-slate-200 font-medium">{selectedSong.movie}</span> ({selectedSong.year}) • Singer: <span className="text-slate-200 font-medium">{selectedSong.artist}</span>
                    </p>
                  </div>

                  {/* Play / Pause indicator */}
                  <button
                    onClick={() => setIsPlaying(!isPlaying)}
                    className="w-12 h-12 rounded-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold flex items-center justify-center transition shadow-lg shadow-amber-500/20"
                    title={isPlaying ? "Pause sync" : "Simulate playback"}
                  >
                    {isPlaying ? "❚❚" : "▶"}
                  </button>
                </div>

                {/* Progress bar */}
                <div className="mt-6 flex items-center gap-3">
                  <span className="text-xs font-mono text-slate-400">00:{playbackSeconds.toString().padStart(2, "0")}</span>
                  <div className="flex-1 bg-slate-800 rounded-full h-1.5 overflow-hidden">
                    <div
                      className="bg-amber-400 h-full transition-all duration-300"
                      style={{ width: `${Math.min(100, (playbackSeconds / 15) * 100)}%` }}
                    />
                  </div>
                  <span className="text-xs font-mono text-slate-500">Demo Sync</span>
                </div>
              </div>

              {/* Interactive Lyric Lines */}
              <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <h3 className="text-sm font-semibold uppercase tracking-wider text-slate-300">
                    Interactive Lyrics (Click any line to analyze)
                  </h3>
                  <span className="text-xs text-amber-400/90 font-medium">Output: {outputLang}</span>
                </div>

                <div className="space-y-3">
                  {selectedSong.lines.map((line, idx) => {
                    const isActive = activeLineIdx === idx;
                    return (
                      <div
                        key={idx}
                        onClick={() => handleLineClick(idx)}
                        className={`p-4 rounded-xl cursor-pointer transition-all border ${
                          isActive
                            ? "bg-slate-800/90 border-amber-500/80 shadow-md shadow-amber-500/5 translate-x-1"
                            : "bg-slate-950/50 border-slate-800/60 hover:border-slate-700"
                        }`}
                      >
                        <div className="flex items-baseline justify-between">
                          <p className="text-lg md:text-xl font-medium text-slate-100 lyric-font">
                            {line.original}
                          </p>
                          <span className="text-xs font-mono text-slate-500 ml-4 shrink-0">
                            00:{line.time.toString().padStart(2, "0")}
                          </span>
                        </div>
                        <p className="text-xs text-amber-300/80 italic mt-1">{line.translit}</p>
                        <p className="text-sm text-slate-300 mt-2 font-light">
                          ↳ {line.translation}
                        </p>
                      </div>
                    );
                  })}
                </div>

                {/* Helpful Search Link for Full Licensed Lyrics */}
                <div className="mt-4 pt-3 border-t border-slate-800 flex justify-between items-center text-xs text-slate-400">
                  <span>To view complete licensed lyrics and credits:</span>
                  <a
                    href={`https://www.google.com/search?q=${encodeURIComponent(selectedSong.title + " " + selectedSong.movie + " song lyrics")}`}
                    target="_blank"
                    rel="noreferrer"
                    className="text-amber-400 hover:underline font-medium"
                  >
                    Search full lyrics on Google ↗
                  </a>
                </div>
              </div>
            </div>

            {/* Right 5 Columns: Word Breakdown & Poetic Meaning */}
            <div className="lg:col-span-5 space-y-6">
              {/* Word-by-word Breakdown */}
              <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <h3 className="text-sm font-semibold uppercase tracking-wider text-slate-300 mb-2">
                  Word-by-Word Analysis
                </h3>
                <p className="text-xs text-slate-400 mb-4">
                  Select any word token to view root lemma, syntax role, and {outputLang} meaning:
                </p>

                {/* Word Chips */}
                <div className="flex flex-wrap gap-2 mb-6">
                  {activeLine.words.map((w, wIdx) => {
                    const isSelected = selectedWord?.word === w.word;
                    return (
                      <button
                        key={wIdx}
                        onClick={() => setSelectedWord(w)}
                        className={`px-3 py-1.5 rounded-lg text-sm font-medium transition ${
                          isSelected
                            ? "bg-amber-500 text-slate-950 font-bold shadow-md shadow-amber-500/20"
                            : "bg-slate-800 text-slate-200 hover:bg-slate-700"
                        }`}
                      >
                        {w.word}
                      </button>
                    );
                  })}
                </div>

                {/* Selected Word Details Card */}
                {selectedWord ? (
                  <div className="bg-slate-950/80 border border-slate-800/80 rounded-xl p-4 space-y-3">
                    <div className="flex justify-between items-baseline">
                      <span className="text-2xl font-bold text-amber-400 lyric-font">{selectedWord.word}</span>
                      <span className="text-xs text-rose-300 font-mono italic">[{selectedWord.translit}]</span>
                    </div>

                    <div className="grid grid-cols-2 gap-2 text-xs border-t border-slate-800/80 pt-3">
                      <div>
                        <span className="text-slate-500 block uppercase font-mono text-[10px]">Meaning ({outputLang})</span>
                        <span className="text-slate-200 font-medium text-sm">{selectedWord.mean}</span>
                      </div>
                      <div>
                        <span className="text-slate-500 block uppercase font-mono text-[10px]">Grammar Role</span>
                        <span className="text-slate-300">{selectedWord.role}</span>
                      </div>
                      <div className="col-span-2 mt-1">
                        <span className="text-slate-500 block uppercase font-mono text-[10px]">Root / Lemma</span>
                        <span className="text-slate-300 font-mono">{selectedWord.root}</span>
                      </div>
                    </div>
                  </div>
                ) : (
                  <p className="text-xs text-slate-500 italic">Select a word chip above</p>
                )}
              </div>

              {/* Contextual & Poetic Meaning */}
              <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
                <h3 className="text-sm font-semibold uppercase tracking-wider text-slate-300">
                  Lyrical Context & Cultural Nuance
                </h3>
                <div className="p-4 rounded-xl bg-slate-950/60 border border-slate-800/80">
                  <span className="text-[10px] font-mono uppercase tracking-wider text-amber-400/90 block mb-1">
                    Line Meaning
                  </span>
                  <p className="text-sm text-slate-200 leading-relaxed">
                    {activeLine.meaning}
                  </p>
                </div>

                <div className="p-4 rounded-xl bg-slate-950/60 border border-slate-800/80">
                  <span className="text-[10px] font-mono uppercase tracking-wider text-rose-400/90 block mb-1">
                    Song Story & Thematic Backdrop
                  </span>
                  <p className="text-sm text-slate-300 leading-relaxed">
                    {selectedSong.synopsis}
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
